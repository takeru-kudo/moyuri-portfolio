name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "apps/hooks-relay/**"
      - ".github/workflows/deploy-workers.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options:
          - beta
          - prod
        default: prod
        required: true
      reason:
        description: Reason (display only)
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: deploy-pipeline-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'prod' }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 12.17.0
  PNPM_SHA256: 2c58959fd5df5cb9f4e72784c08a60ffc7ee558fed9b04b22254e29112203a51
  WRANGLER_SEND_METRICS: "false"
  FORCE_COLOR: "0"

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      target: ${{ steps.inputs.outputs.target }}
    steps:
      - name: Validate inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$TARGET" in
              beta | prod) target="$TARGET" ;;
              *)
                echo "::error::Invalid target input"
                exit 1
                ;;
            esac
            printf 'reason: %q\n' "$REASON"
          else
            target=prod
          fi
          printf 'target: %s\n' "$target"
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"

  fetch-published:
    needs: [prepare]
    if: needs.prepare.outputs.target == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: content
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Fetch published content
        env:
          MICROCMS_SERVICE_ID: ${{ vars.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY_PUBLISHED: ${{ secrets.MICROCMS_API_KEY_PUBLISHED }}
        run: |
          set -euo pipefail
          node tools/fetch-content/fetch.mjs --mode published --out "$RUNNER_TEMP/content-published"
          for endpoint in profile site; do
            if [ "$(tr -d '[:space:]' < "$RUNNER_TEMP/content-published/${endpoint}.json")" = "null" ]; then
              echo "::warning::The ${endpoint} API returned 404; building without it"
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-published
          path: ${{ runner.temp }}/content-published/
          if-no-files-found: error
          retention-days: 1

      - name: Upload nightly backup
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-published-backup
          path: ${{ runner.temp }}/content-published/
          if-no-files-found: error
          retention-days: 14

  fetch-draft:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: content-draft
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Fetch draft content
        env:
          MICROCMS_SERVICE_ID: ${{ vars.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY_DRAFT: ${{ secrets.MICROCMS_API_KEY_DRAFT }}
        run: |
          set -euo pipefail
          node tools/fetch-content/fetch.mjs --mode draft --out "$RUNNER_TEMP/content-draft"
          for endpoint in profile site; do
            if [ "$(tr -d '[:space:]' < "$RUNNER_TEMP/content-draft/${endpoint}.json")" = "null" ]; then
              echo "::warning::The ${endpoint} API returned 404; building without it"
            fi
          done

      - name: Encrypt draft content
        env:
          DRAFT_ARTIFACT_KEY: ${{ secrets.DRAFT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/content-draft.tar" content-draft
          mkdir "$RUNNER_TEMP/encrypted"
          node tools/draft-crypto/crypt.mjs encrypt \
            --in "$RUNNER_TEMP/content-draft.tar" --out "$RUNNER_TEMP/encrypted/content-draft.tar.enc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-draft-encrypted
          path: ${{ runner.temp }}/encrypted/content-draft.tar.enc
          if-no-files-found: error
          retention-days: 1

  build-prod:
    needs: [prepare, fetch-published]
    if: needs.prepare.outputs.target == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: content-published
          path: ${{ runner.temp }}/content-published/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Install pnpm
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/.mise.toml")"
          if [ "$want" != "$PNPM_VERSION" ]; then
            echo "::error::.mise.toml pnpm ($want) does not match PNPM_VERSION ($PNPM_VERSION)"
            exit 1
          fi
          tgz=pnpm-linux-x64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tgz" "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${tgz}"
          printf '%s  %s\n' "$PNPM_SHA256" "$tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/pnpm-bin"
          printf '%s\n' "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          CONTENT_DIR: ${{ runner.temp }}/content-published
          CONTENT_MODE: published
        run: pnpm --filter @portfolio/site run build

      - name: Write version.txt
        run: printf '%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > apps/site/dist/version.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-beta:
    needs: [prepare, fetch-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: draft
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Install pnpm
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/.mise.toml")"
          if [ "$want" != "$PNPM_VERSION" ]; then
            echo "::error::.mise.toml pnpm ($want) does not match PNPM_VERSION ($PNPM_VERSION)"
            exit 1
          fi
          tgz=pnpm-linux-x64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tgz" "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${tgz}"
          printf '%s  %s\n' "$PNPM_SHA256" "$tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/pnpm-bin"
          printf '%s\n' "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: content-draft-encrypted
          path: ${{ runner.temp }}/encrypted/

      - name: Decrypt draft content
        env:
          DRAFT_ARTIFACT_KEY: ${{ secrets.DRAFT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          node tools/draft-crypto/crypt.mjs decrypt \
            --in "$RUNNER_TEMP/encrypted/content-draft.tar.enc" --out "$RUNNER_TEMP/content-draft.tar"
          mkdir "$RUNNER_TEMP/content"
          tar -C "$RUNNER_TEMP/content" --no-same-owner -xf "$RUNNER_TEMP/content-draft.tar"
          rm -f "$RUNNER_TEMP/content-draft.tar"

      - name: Build site
        working-directory: apps/site
        env:
          CONTENT_DIR: ${{ runner.temp }}/content/content-draft
          CONTENT_MODE: draft
        run: |
          set -euo pipefail
          pnpm exec astro build --silent
          printf '%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/version.txt
          printf 'Pages built: %s\n' "$(find dist -type f -name '*.html' | wc -l)"
          if [ ! -f dist/projects/draft-canary/index.html ]; then
            echo "::error::The draft canary page (draft-canary) is missing from the Beta build"
            exit 1
          fi
          echo "Draft canary page: present"

      - name: Encrypt site
        env:
          DRAFT_ARTIFACT_KEY: ${{ secrets.DRAFT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          tar -C apps/site -cf "$RUNNER_TEMP/site-beta.tar" dist
          mkdir "$RUNNER_TEMP/encrypted-site"
          node tools/draft-crypto/crypt.mjs encrypt \
            --in "$RUNNER_TEMP/site-beta.tar" --out "$RUNNER_TEMP/encrypted-site/site-beta.tar.enc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-beta-encrypted
          path: ${{ runner.temp }}/encrypted-site/site-beta.tar.enc
          if-no-files-found: error
          retention-days: 1

  deploy-beta:
    needs: [prepare, build-beta]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deploy
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Install pnpm
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/.mise.toml")"
          if [ "$want" != "$PNPM_VERSION" ]; then
            echo "::error::.mise.toml pnpm ($want) does not match PNPM_VERSION ($PNPM_VERSION)"
            exit 1
          fi
          tgz=pnpm-linux-x64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tgz" "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${tgz}"
          printf '%s  %s\n' "$PNPM_SHA256" "$tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/pnpm-bin"
          printf '%s\n' "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      - name: Install deployer
        run: pnpm --dir tools/deployer install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-beta-encrypted
          path: ${{ runner.temp }}/encrypted-site/

      - name: Decrypt site
        env:
          DRAFT_ARTIFACT_KEY: ${{ secrets.DRAFT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          node tools/draft-crypto/crypt.mjs decrypt \
            --in "$RUNNER_TEMP/encrypted-site/site-beta.tar.enc" --out "$RUNNER_TEMP/site-beta.tar"
          mkdir "$RUNNER_TEMP/site-beta"
          tar -C "$RUNNER_TEMP/site-beta" --no-same-owner -xf "$RUNNER_TEMP/site-beta.tar"
          rm -f "$RUNNER_TEMP/site-beta.tar"
          if [ ! -f "$RUNNER_TEMP/site-beta/dist/index.html" ]; then
            echo "::error::The decrypted Beta site has no index.html"
            exit 1
          fi

      - name: Upload version
        id: upload
        env:
          WRANGLER_LOG: warn
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          set -euo pipefail
          pnpm --dir tools/deployer exec wrangler versions upload \
            --env beta --config ../../apps/site/wrangler.jsonc \
            --assets "$RUNNER_TEMP/site-beta/dist" \
            --message "${GITHUB_SHA}-${GITHUB_RUN_ID}" < /dev/null
          version_id="$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          if ! printf '%s' "$version_id" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::Could not read a valid version ID from the wrangler output"
            exit 1
          fi
          printf 'Uploaded beta version: %s\n' "$version_id"
          printf 'version-id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"

      - name: Deploy version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version-id }}
        run: |
          set -euo pipefail
          pnpm --dir tools/deployer exec wrangler versions deploy "${VERSION_ID}@100" \
            --env beta --config ../../apps/site/wrangler.jsonc \
            --message "${GITHUB_SHA}-${GITHUB_RUN_ID}" --yes < /dev/null

  upload-prod:
    needs: [prepare, build-prod, deploy-beta]
    if: needs.prepare.outputs.target == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deploy
    permissions:
      contents: read
    outputs:
      version-id: ${{ steps.upload.outputs.version-id }}
      preview-url: ${{ steps.upload.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Install pnpm
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/.mise.toml")"
          if [ "$want" != "$PNPM_VERSION" ]; then
            echo "::error::.mise.toml pnpm ($want) does not match PNPM_VERSION ($PNPM_VERSION)"
            exit 1
          fi
          tgz=pnpm-linux-x64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tgz" "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${tgz}"
          printf '%s  %s\n' "$PNPM_SHA256" "$tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/pnpm-bin"
          printf '%s\n' "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      - name: Install deployer
        run: pnpm --dir tools/deployer install --frozen-lockfile

      - name: Upload version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WORKERS_SUBDOMAIN" | grep -Eqx '[a-z0-9]([a-z0-9-]*[a-z0-9])?'; then
            echo "::error::WORKERS_SUBDOMAIN is missing or invalid"
            exit 1
          fi
          pnpm --dir tools/deployer exec wrangler versions upload \
            --env prod --config ../../apps/site/wrangler.jsonc \
            --message "${GITHUB_SHA}-${GITHUB_RUN_ID}" < /dev/null
          version_id="$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          if ! printf '%s' "$version_id" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::Could not read a valid version ID from the wrangler output"
            exit 1
          fi
          printf 'Uploaded prod version: %s\n' "$version_id"
          printf 'version-id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
          preview_url="$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          if [ -z "$preview_url" ]; then
            echo "::error::No preview URL in the wrangler output; preview URLs are disabled for site-prod"
            exit 1
          fi
          expected_url="https://${version_id:0:8}-site-prod.${WORKERS_SUBDOMAIN}.workers.dev"
          if [ "$preview_url" != "$expected_url" ]; then
            echo "::error::The preview URL in the wrangler output does not match the uploaded version"
            exit 1
          fi
          printf 'Preview URL: %s\n' "$preview_url"
          printf 'preview-url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [upload-prod]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: e2e
    permissions:
      contents: read
    steps:
      - name: Validate preview URL
        env:
          PREVIEW_URL: ${{ needs.upload-prod.outputs.preview-url }}
          VERSION_ID: ${{ needs.upload-prod.outputs.version-id }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WORKERS_SUBDOMAIN" | grep -Eqx '[a-z0-9]([a-z0-9-]*[a-z0-9])?'; then
            echo "::error::WORKERS_SUBDOMAIN is missing or invalid"
            exit 1
          fi
          if ! printf '%s' "$VERSION_ID" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::upload-prod did not provide a valid version ID"
            exit 1
          fi
          if [ "$PREVIEW_URL" != "https://${VERSION_ID:0:8}-site-prod.${WORKERS_SUBDOMAIN}.workers.dev" ]; then
            echo "::error::upload-prod did not provide the preview URL of the uploaded version"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Install pnpm
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/.mise.toml")"
          if [ "$want" != "$PNPM_VERSION" ]; then
            echo "::error::.mise.toml pnpm ($want) does not match PNPM_VERSION ($PNPM_VERSION)"
            exit 1
          fi
          tgz=pnpm-linux-x64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tgz" "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${tgz}"
          printf '%s  %s\n' "$PNPM_SHA256" "$tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/pnpm-bin"
          printf '%s\n' "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      - name: Check Google Chrome
        run: |
          set -euo pipefail
          if [ ! -x /opt/google/chrome/chrome ]; then
            echo "::error::Google Chrome is not installed on the runner"
            exit 1
          fi
          google-chrome --version

      - name: Install E2E dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts --filter-prod '@portfolio/e2e...'

      - name: Check installed packages
        run: |
          set -euo pipefail
          if ! find node_modules/.pnpm -mindepth 1 -maxdepth 1 -type d -name 'playwright-core@*' | grep -q .; then
            echo "::error::playwright-core was not found in node_modules/.pnpm"
            exit 1
          fi
          found="$(find node_modules/.pnpm -mindepth 1 -maxdepth 1 \( \
            -name 'astro@*' -o -name 'esbuild@*' -o -name '@esbuild+*' \
            -o -name 'sharp@*' -o -name '@img+sharp*' \
            -o -name 'workerd@*' -o -name '@cloudflare+workerd*' -o -name 'wrangler@*' \) -print)"
          if [ -n "$found" ]; then
            echo "::error::Packages outside the E2E set were installed:"
            printf '%s\n' "$found"
            exit 1
          fi
          printf 'Installed packages: %s\n' "$(find node_modules/.pnpm -mindepth 1 -maxdepth 1 -type d ! -name node_modules | wc -l)"

      - name: Run E2E tests
        env:
          PREVIEW_URL: ${{ needs.upload-prod.outputs.preview-url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm --filter @portfolio/e2e run e2e

  deploy-prod:
    needs: [upload-prod, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: deploy
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate version ID
        env:
          NEW_VERSION_ID: ${{ needs.upload-prod.outputs.version-id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$NEW_VERSION_ID" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::upload-prod did not provide a valid version ID"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Install pnpm
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/.mise.toml")"
          if [ "$want" != "$PNPM_VERSION" ]; then
            echo "::error::.mise.toml pnpm ($want) does not match PNPM_VERSION ($PNPM_VERSION)"
            exit 1
          fi
          tgz=pnpm-linux-x64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tgz" "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${tgz}"
          printf '%s  %s\n' "$PNPM_SHA256" "$tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/pnpm-bin"
          printf '%s\n' "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      - name: Install deployer
        run: pnpm --dir tools/deployer install --frozen-lockfile

      - name: Read current version
        id: current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm --silent --dir tools/deployer exec wrangler deployments status \
            --env prod --config ../../apps/site/wrangler.jsonc --json < /dev/null > "$RUNNER_TEMP/deployment-status.json"
          current="$(jq -r '[.versions[]? | select(.percentage == 100) | .version_id] | if length == 1 then .[0] else empty end' "$RUNNER_TEMP/deployment-status.json")"
          if ! printf '%s' "$current" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::Could not read a single version at 100% from the current deployment"
            exit 1
          fi
          printf 'Rollback target (currently at 100%%): %s\n' "$current"
          printf 'version-id=%s\n' "$current" >> "$GITHUB_OUTPUT"

      - name: Check for a newer deployed run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CURRENT_VERSION_ID: ${{ steps.current.outputs.version-id }}
        run: |
          set -euo pipefail
          pnpm --silent --dir tools/deployer exec wrangler versions view "$CURRENT_VERSION_ID" \
            --env prod --config ../../apps/site/wrangler.jsonc --json < /dev/null > "$RUNNER_TEMP/current-version.json"
          if ! jq -e --arg id "$CURRENT_VERSION_ID" '.id == $id' "$RUNNER_TEMP/current-version.json" > /dev/null; then
            echo "::error::Could not read the current version from the wrangler output"
            exit 1
          fi
          message="$(jq -r '.annotations["workers/message"] // empty' "$RUNNER_TEMP/current-version.json")"
          if [[ ! "$message" =~ ^[0-9a-f]{40}-([0-9]{1,18})$ ]]; then
            echo "::warning::The current version's message is not <sha>-<run_id>; skipping the newer-run check"
            exit 0
          fi
          current_run_id="${BASH_REMATCH[1]}"
          printf 'Run ID of the current version: %s\n' "$current_run_id"
          if [ "$current_run_id" -gt "$GITHUB_RUN_ID" ]; then
            echo "::error::Prod already serves a version from a newer run (${current_run_id}); not deploying run ${GITHUB_RUN_ID}"
            exit 1
          fi

      - name: Deploy version
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEW_VERSION_ID: ${{ needs.upload-prod.outputs.version-id }}
        run: |
          set -euo pipefail
          printf 'Deploying prod version: %s\n' "$NEW_VERSION_ID"
          pnpm --dir tools/deployer exec wrangler versions deploy "${NEW_VERSION_ID}@100" \
            --env prod --config ../../apps/site/wrangler.jsonc \
            --message "${GITHUB_SHA}-${GITHUB_RUN_ID}" --yes < /dev/null

      - name: Smoke test
        id: smoke
        timeout-minutes: 8
        run: |
          set +e
          node tools/deployer/smoke.mjs
          code=$?
          set -e
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "::error::Only the HSTS baseline failed. Not rolling back; fix the zone setting via infra.yml."
          fi
          exit "$code"

      - name: Roll back
        if: >-
          (failure() || cancelled())
          && steps.current.outcome == 'success'
          && steps.deploy.outcome != 'skipped'
          && steps.smoke.outcome != 'success'
          && steps.smoke.outputs.code != '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION_ID: ${{ steps.current.outputs.version-id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$ROLLBACK_VERSION_ID" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::No valid rollback target"
            exit 1
          fi
          printf 'Rolling back prod to: %s\n' "$ROLLBACK_VERSION_ID"
          pnpm --dir tools/deployer exec wrangler rollback "$ROLLBACK_VERSION_ID" \
            --env prod --config ../../apps/site/wrangler.jsonc \
            --message "Deploy or smoke test did not pass in run ${GITHUB_RUN_ID}" --yes < /dev/null
          echo "::error::Deploy or smoke test did not pass; prod was rolled back to ${ROLLBACK_VERSION_ID}"

  report-failure:
    needs: [prepare, fetch-published, fetch-draft, build-prod, build-beta, deploy-beta, upload-prod, e2e, deploy-prod]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create or comment on incident issue
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Workflow \`${GITHUB_WORKFLOW}\` failed or was cancelled: ${run_url}"
          gh label create incident --color B60205 --description "Automated failure report" 2>/dev/null || true
          number="$(gh issue list --label incident --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Workflow failure: ${GITHUB_WORKFLOW}" --label incident --body "$body"
          fi
