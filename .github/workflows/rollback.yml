name: rollback

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker to roll back
        type: choice
        options:
          - beta
          - prod
          - hooks-relay
          - csp-report
        required: true
      version-id:
        description: Version ID to roll back to (empty = previous version)
        type: string
        required: false
        default: ""

permissions: {}

env:
  PNPM_VERSION: 12.17.0
  PNPM_SHA256: 2c58959fd5df5cb9f4e72784c08a60ffc7ee558fed9b04b22254e29112203a51
  WRANGLER_SEND_METRICS: "false"
  FORCE_COLOR: "0"

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deploy
    concurrency:
      group: deploy-${{ contains(fromJSON('["prod","hooks-relay","csp-report"]'), inputs.worker) && inputs.worker || 'beta' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        env:
          WORKER: ${{ inputs.worker }}
          VERSION_ID: ${{ inputs.version-id }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            beta | prod | hooks-relay | csp-report) ;;
            *)
              echo "::error::Invalid worker input"
              exit 1
              ;;
          esac
          if [ -n "$VERSION_ID" ] && ! printf '%s' "$VERSION_ID" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::version-id must be empty or a lowercase UUID"
            exit 1
          fi
          printf 'worker: %s\n' "$WORKER"
          printf 'version-id: %s\n' "${VERSION_ID:-(previous version)}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          package-manager-cache: false

      - name: Install pnpm
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/.mise.toml")"
          if [ "$want" != "$PNPM_VERSION" ]; then
            echo "::error::.mise.toml pnpm ($want) does not match PNPM_VERSION ($PNPM_VERSION)"
            exit 1
          fi
          tgz=pnpm-linux-x64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tgz" "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${tgz}"
          printf '%s  %s\n' "$PNPM_SHA256" "$tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/pnpm-bin"
          printf '%s\n' "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      - name: Install deployer
        run: pnpm --dir tools/deployer install --frozen-lockfile

      - name: Read Worker version
        id: before
        if: inputs.worker == 'hooks-relay' || inputs.worker == 'csp-report'
        env:
          WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            hooks-relay) host=hooks.moyuri-kudo.com ;;
            csp-report) host=csp.moyuri-kudo.com ;;
            *)
              echo "::error::Invalid worker input"
              exit 1
              ;;
          esac
          body="$(curl -sS --proto '=https' --max-time 10 -H 'Cache-Control: no-cache' \
            "https://${host}/healthz?rollback=${GITHUB_RUN_ID}-0" || true)"
          version="$(printf '%s' "$body" | jq -r 'if type == "object" and .status == "ok" then .version // empty else empty end' 2>/dev/null || true)"
          if ! printf '%s' "$version" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            version=""
          fi
          printf 'Version before the rollback: %s\n' "${version:-(unknown)}"
          printf 'version-id=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Roll back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ inputs.worker }}
          VERSION_ID: ${{ inputs.version-id }}
        run: |
          set -euo pipefail
          args=(rollback)
          if [ -n "$VERSION_ID" ]; then
            args+=("$VERSION_ID")
          fi
          case "$WORKER" in
            beta | prod) args+=(--env "$WORKER" --config ../../apps/site/wrangler.jsonc) ;;
            hooks-relay) args+=(--config ../../apps/hooks-relay/wrangler.jsonc) ;;
            csp-report) args+=(--config ../../apps/csp-report/wrangler.jsonc) ;;
            *)
              echo "::error::Invalid worker input"
              exit 1
              ;;
          esac
          pnpm --dir tools/deployer exec wrangler "${args[@]}" \
            --message "Manual rollback in run ${GITHUB_RUN_ID}" --yes < /dev/null

      - name: Check production
        if: inputs.worker == 'prod'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --proto '=https' --max-time 15 \
              -H 'Cache-Control: no-cache' "https://moyuri-kudo.com/?rollback=${GITHUB_RUN_ID}-${attempt}" || true)"
            printf 'attempt %s: status %s\n' "$attempt" "$status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://moyuri-kudo.com/ did not return 200 after the rollback"
          exit 1

      - name: Check Worker /healthz
        if: inputs.worker == 'hooks-relay' || inputs.worker == 'csp-report'
        env:
          WORKER: ${{ inputs.worker }}
          VERSION_ID: ${{ inputs.version-id }}
          BEFORE_VERSION_ID: ${{ steps.before.outputs.version-id }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            hooks-relay) host=hooks.moyuri-kudo.com ;;
            csp-report) host=csp.moyuri-kudo.com ;;
            *)
              echo "::error::Invalid worker input"
              exit 1
              ;;
          esac
          if [ -z "$VERSION_ID" ] && [ -z "$BEFORE_VERSION_ID" ]; then
            echo "::warning::The version before the rollback is unknown; checking /healthz status only"
          fi
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -sS --proto '=https' --max-time 10 -H 'Cache-Control: no-cache' \
              "https://${host}/healthz?rollback=${GITHUB_RUN_ID}-${attempt}" || true)"
            version="$(printf '%s' "$body" | jq -r 'if type == "object" and .status == "ok" then .version // empty else empty end' 2>/dev/null || true)"
            printf 'attempt %s: version %s\n' "$attempt" "${version:-(none)}"
            if [ -n "$VERSION_ID" ]; then
              expected=0
              [ "$version" = "$VERSION_ID" ] && expected=1
            else
              expected=0
              [ -n "$version" ] && [ "$version" != "$BEFORE_VERSION_ID" ] && expected=1
            fi
            if [ "$expected" = 1 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://${host}/healthz did not report the expected version after the rollback"
          exit 1

  report-failure:
    needs: [rollback]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create or comment on incident issue
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Workflow \`${GITHUB_WORKFLOW}\` failed or was cancelled: ${run_url}"
          gh label create incident --color B60205 --description "Automated failure report" 2>/dev/null || true
          number="$(gh issue list --label incident --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Workflow failure: ${GITHUB_WORKFLOW}" --label incident --body "$body"
          fi
